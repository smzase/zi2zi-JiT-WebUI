x-webui-common: &webui-common
  image: zi2zi-jit-webui:latest
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  shm_size: ${ZI2ZI_SHM_SIZE:-4gb}
  stop_grace_period: 30s
  ports:
    - "${WEBUI_BIND_HOST:-127.0.0.1}:${WEBUI_PORT:-7860}:7860"
    - "${WEBUI_BIND_HOST:-127.0.0.1}:${TENSORBOARD_PORT:-6006}:6006"
  environment:
    ZI2ZI_TENSORBOARD_URL: ${ZI2ZI_TENSORBOARD_URL:-http://127.0.0.1:${TENSORBOARD_PORT:-6006}}
    ZI2ZI_TORCH_COMPILE: ${ZI2ZI_TORCH_COMPILE:-auto}
  volumes:
    - ${WEBUI_DATA_DIR:-./webui_data}:/data
    - webui_cache:/root/.cache
  restart: unless-stopped

services:
  webui:
    <<: *webui-common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  webui-cpu:
    <<: *webui-common
    profiles: ["cpu"]

volumes:
  webui_cache:
